<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影句闪播 - 电影片段搜索</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:PingFang SC,Microsoft YaHei;}
        body {background:#f5f7fa;padding:20px;}
        .container {max-width:1000px;margin:0 auto;}
        .header {text-align:center;margin:40px 0;}
        .header h1 {font-size:32px;color:#222;margin-bottom:10px;}
        .header p {color:#666;font-size:16px;}
        .search-box {display:flex;gap:10px;margin-bottom:30px;}
        #search-input {flex:1;padding:14px 20px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none;}
        #search-btn {padding:14px 30px;background:#6366f1;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
        .result-card {background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.05);margin-bottom:20px;}
        .card-title {font-size:20px;font-weight:600;margin-bottom:8px;color:#222;}
        .quote-text {font-size:16px;line-height:1.6;margin:15px 0;padding:10px;background:#f8f9fa;border-radius:6px;}
        .video-box {width:100%;height:320px;border-radius:8px;overflow:hidden;margin-top:10px;}
        .video-box video {width:100%;height:100%;object-fit:cover;}
        .copy-btn {padding:8px 16px;background:#eef2ff;color:#6366f1;border:none;border-radius:6px;cursor:pointer;margin-top:10px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>影句闪播</h1>
            <p>输入台词，精准搜索电影片段</p >
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="输入台词（中英均可）">
            <button id="search-btn">搜索</button>
        </div>
        <div class="result-list" id="result-list"></div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultList = document.getElementById('result-list');

        searchBtn.addEventListener('click', searchMovie);
        searchInput.addEventListener('keydown', (e) => {if(e.key === 'Enter') searchMovie();});

        async function searchMovie() {
            const keyword = searchInput.value.trim();
            if(!keyword) {alert('请输入台词');return;}
            resultList.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">正在搜索片段...</div>';

            try {
                // 对接国内可用影视台词接口
                const res = await fetch(`https://api.yingcisou.com/api/search?keyword=${encodeURIComponent(keyword)}`);
                const data = await res.json();

                if(data.list && data.list.length > 0) {
                    resultList.innerHTML = '';
                    data.list.forEach(item => {
                        resultList.innerHTML += `
                            <div class="result-card">
                                <h3 class="card-title">${item.movieName}</h3>
                                <div class="quote-text">${item.quote}</div>
                                <div class="video-box">
                                    <video controls src="${item.videoUrl}"></video>
                                </div>
                                <button class="copy-btn" onclick="copyText('${item.quote}')">复制台词</button>
                            </div>
                        `;
                    });
                } else {
                    resultList.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">未找到对应片段</div>';
                }
            } catch (err) {
                resultList.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">搜索失败，请稍后重试</div>';
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('台词复制成功');
        }
    </script>
</body>
</html>
