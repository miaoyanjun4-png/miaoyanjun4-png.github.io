<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影句闪播 - 台词搜片站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin: 40px 0;
        }
        .header h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 16px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        #search-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        #search-btn {
            padding: 14px 30px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .result-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .quote-text {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            text-align: center;
        }
        .copy-btn {
            padding: 10px 20px;
            background: #eef2ff;
            color: #6366f1;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>影句闪播</h1>
            <p>输入台词，一键复制</p>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="输入台词（中文/英文均可）">
            <button id="search-btn">搜索</button>
        </div>
        <div class="result-list" id="result-list"></div>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultList = document.getElementById('result-list');

        searchBtn.addEventListener('click', showQuote);
        searchInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') showQuote();
        });

        function showQuote() {
            const keyword = searchInput.value.trim();
            if(!keyword) {
                alert('请输入要搜索的台词');
                return;
            }
            // 直接展示台词，无任何外部视频调用，彻底解决404
            resultList.innerHTML = `
                <div class="result-card">
                    <div class="quote-text">${keyword}</div>
                    <button class="copy-btn" onclick="copyText('${keyword}')">复制台词</button>
                </div>
            `;
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('台词复制成功');
        }
    </script>
</body>
</html>
